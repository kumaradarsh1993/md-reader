[package]
name = "md-reader"
version = "0.9.0"
description = "Fox MD — a warm, lightweight cross-platform Markdown reader and editor"
authors = ["Fox MD contributors"]
edition = "2021"

[lib]
name = "md_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` enables F12 / right-click → Inspect even in release builds.
# Without this we cannot debug spawned windows in production.
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "2"
# tauri-plugin-fs deliberately absent — see capabilities/default.json. File I/O
# goes through the open_file / save_file commands, not through the webview.
tauri-plugin-store = "2"
tauri-plugin-opener = "2"

# API keys live in the native credential store (Windows Credential Manager,
# macOS Keychain, or Linux Secret Service). The crate's default `v1` feature
# selects the native backend for each desktop target.
keyring = "4.1.6"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

comrak = { version = "0.43", default-features = false, features = ["syntect"] }
notify = "8"
notify-debouncer-full = "0.5"

once_cell = "1"
parking_lot = "0.12"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"

# Windows-only:
#  - AllowSetForegroundWindow, so a torn-out child process can bring its own
#    window to the front on spawn (the default Windows policy buries new
#    windows behind the parent).
#  - DwmSetWindowAttribute, so the title bar follows the app theme instead of
#    staying whatever the OS decided.
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Dwm",
  "Win32_Foundation",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
