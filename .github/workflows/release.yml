name: Build & release installers

# Triggers only on tag push (v*). Hand-trigger via "workflow_dispatch" if you
# need to test the workflow without cutting a real release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build for (used as the release name)"
        required: true
        default: "v0.0.0-test"

permissions:
  contents: write

jobs:
  # Fox MD was the only one of the four Fox desktop apps whose release workflow
  # went straight to bundling — wispr-fox, FoxCull and Fox Mark all gate on
  # checks first. A tag could therefore publish installers built from code that
  # does not type-check, and nothing would say so until someone ran the app.
  #
  # Deliberately NOT running `cargo test` yet: the other three run
  # `cargo test --lib` here, but this crate's tests have never been executed on
  # a Linux runner and a release is the wrong place to find out. Add it once
  # someone has watched it pass.
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci
      - name: Check frontend
        run: npm run check
      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple Silicon (M1+). Universal binary covers Intel + ARM
          # in one .dmg via Tauri's --target universal-apple-darwin.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            label: macos
          # Linux — produces .deb + .AppImage by default.
          - platform: ubuntu-22.04
            args: ""
            label: linux
          # Windows — produces .msi + .exe (NSIS).
          - platform: windows-latest
            args: ""
            label: windows

    runs-on: ${{ matrix.platform }}

    # Resolved once, because `github.ref_name` means two different things: the
    # TAG on a tag push, the BRANCH on a workflow_dispatch. Every consumer below
    # reads this instead — otherwise a hand-triggered nightly is published as a
    # non-prerelease draft named "master".
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}


    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Universal Apple binary needs both ARM and x86_64 targets.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS deps
        run: npm ci

      # Stamp the build's version from the tag, the way FoxCull and Fox Mark
      # already do.
      #
      # Without this, a nightly reports its BASE version: the binary built from
      # tag v0.10.0-nightly.3 has CARGO_PKG_VERSION = "0.10.0", because that is
      # what the committed files say. The in-app updater compares against that,
      # and semver puts a plain 0.10.0 ABOVE 0.10.0-nightly.4 - so a user on
      # nightly.3 is told "you're on this or newer" and never sees nightly.4.
      # Silent, and indistinguishable from there being no update.
      #
      # The committed files keep the base version; this only rewrites them in CI.
      #
      # TWO different versions get written, and they have to be different:
      #
      #   Cargo.toml       the FULL tag version, e.g. 0.10.0-nightly.4. This is
      #                    what becomes CARGO_PKG_VERSION and therefore what the
      #                    updater reports as the running build. It must be
      #                    exact or the comparison above is pointless.
      #
      #   tauri.conf.json  a WiX-legal version, e.g. 0.10.0-4. Fox MD bundles an
      #                    .msi (unlike the other three apps, which are NSIS
      #                    only), and MSI refuses a non-numeric pre-release:
      #                    "optional pre-release identifier in app version must
      #                    be numeric-only and cannot be greater than 65535 for
      #                    msi target". Stamping the full version here fails the
      #                    Windows job while Linux and macOS pass, which
      #                    publishes a release with no Windows installer in it.
      #
      # Keeping the ordinal (0.10.0-4, not bare 0.10.0) means two nightlies never
      # produce identically-named installers.
      - name: Stamp version from tag
        shell: bash
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          VER="${TAG#v}"
          if [ "$VER" != "${VER%%-*}" ]; then
            ORDINAL="$(printf '%s' "${VER#*-}" | tr -cd '0-9')"
            BUNDLE_VER="${VER%%-*}-${ORDINAL:-0}"
          else
            BUNDLE_VER="$VER"
          fi
          echo "binary version = $VER ; bundle version = $BUNDLE_VER"
          # The trailing newline is String.fromCharCode(10) rather than a
          # backslash-n: this is a shell string inside YAML, and the escape does
          # not survive both layers reliably.
          stamp_json() {
            node -e "const fs=require('fs');const p=process.argv[1];const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version=process.argv[2];fs.writeFileSync(p,JSON.stringify(c,null,2)+String.fromCharCode(10));console.log(p,'=>',c.version);" "$1" "$2"
          }
          stamp_json src-tauri/tauri.conf.json "$BUNDLE_VER"
          stamp_json package.json "$BUNDLE_VER"
          perl -0pi -e "s/^version = \"[^\"]+\"/version = \"${VER}\"/m" src-tauri/Cargo.toml
          grep '^version' src-tauri/Cargo.toml

      # tauri-action builds the app and, when given a tagName, creates a draft
      # GitHub Release for that tag and uploads the platform artifacts to it.
      # The first job to run creates the draft; subsequent jobs upload into it.
      # cut a release literally named "master". The event has to be tested.
      - name: Build & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Fox MD ${{ env.RELEASE_TAG }}"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for full notes.

            **Downloads**
            - Windows: `.msi` (recommended) or `.exe` (NSIS)
            - macOS: `.dmg` (universal — Apple Silicon + Intel)
            - Linux: `.AppImage` (portable) or `.deb` (Debian/Ubuntu)

            Not notarized — first launch shows a warning on both platforms.

            - **macOS:** double-click, click **Done** on "Apple could not verify...", then **System Settings → Privacy & Security → Open Anyway**. (Right-click → Open no longer works on macOS 15+.) Terminal equivalent: `xattr -dr com.apple.quarantine "/Applications/Fox MD.app"`
            - **Windows:** "More info" → "Run anyway" on the SmartScreen prompt.
          # Nightlies publish immediately as pre-releases; stable tags land as
          # drafts so the notes can be written before anyone sees them.
          #
          # This is load-bearing for the in-app updater, not a preference:
          # GitHub's API does not return *draft* releases to an unauthenticated
          # caller, so while nightlies were drafts the app could not see that a
          # newer build existed. A pre-release is public and is excluded from
          # `latest`, which is exactly the semantics a nightly wants.
          releaseDraft: ${{ !contains(env.RELEASE_TAG, '-nightly') }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-nightly') }}
          args: ${{ matrix.args }}

      # Guard: tauri-bundler only signs the .app when bundle.macOS.signingIdentity
      # is set. Without it Contents/_CodeSignature is absent, and macOS rejects the
      # app on launch ("Apple could not verify..." at best, "damaged" at worst).
      # Fail here rather than shipping a .dmg nobody can open.
      - name: Verify macOS bundle signature
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos \
                  -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No .app bundle produced by the build"; exit 1
          fi
          echo "Verifying $APP"
          if [ ! -f "$APP/Contents/_CodeSignature/CodeResources" ]; then
            echo "::error::Missing Contents/_CodeSignature/CodeResources - macOS will refuse to open this app"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "Bundle signature verified."
